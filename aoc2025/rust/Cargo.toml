[package]
name = "aoc2025"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
chrono = "0.4.42"
clap = { version = "4.5.54", features = ["derive"] }
csv = "1.4.0"
good_lp = "1.14.2"
itertools = "0.14.0"
libc = "0.2.180"
once_cell = "1.21.3"
rayon = "1.11.0"
regex = "1.12.2"
reqwest = { version = "0.13.1", features = ["blocking", "cookies"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
